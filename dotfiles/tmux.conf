# tmux has no config of its own here otherwise, so it falls back to
# whatever terminal-features it negotiated with the client attached when its
# *server* first started -- and that negotiation sticks for the server's
# lifetime, even when a different (or better-provisioned) client attaches
# later. A long-lived session that was ever first attached from something
# other than a fully terminfo'd Ghostty client keeps emitting truecolor SGR
# codes the current client wasn't told to expect, which print as literal
# garbage instead of getting interpreted -- most visibly right at the left
# margin, where redraws and prompt lines land.
#
# Being explicit here means tmux always presents "tmux-256color" to programs
# inside panes (a real, stable terminfo entry every image ships), while
# telling itself the *outer* terminal supports truecolor whenever it sees
# xterm-ghostty or the xterm-256color SSH-fallback TERM (see dotfiles
# README's terminfo section) -- regardless of stale server-start negotiation.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
